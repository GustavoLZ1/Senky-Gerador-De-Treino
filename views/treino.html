<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/treino.css">
</head>
<body>

<header class="top">
  <div class="logo"><i></i>SENKY</div>
  <nav>
    <a class="link" href="objetivo.html">Novo treino</a>
    <span class="usuario" id="usuario"></span>
    <button class="btn ghost mini" id="sair" type="button">Sair</button>
  </nav>
</header>

<main class="stage">

  <div class="cabeca" id="cabeca">
    <span class="chip">Objetivo: <b id="obj"></b></span>
    <div class="progresso">
      <div class="barra"><i id="barra"></i></div>
      <span id="prog-txt"></span>
    </div>
  </div>

  <div class="workout" id="workout">
    <section class="atual" aria-live="polite">
      <article class="ex" id="ex">
        <span class="grupo" id="ex-grupo"></span>
        <h1 id="ex-nome"></h1>
        <div class="dados">
          <div><b id="ex-series"></b><span>séries</span></div>
          <div><b id="ex-reps"></b><span>repetições</span></div>
          <div><b id="ex-desc"></b><span>descanso</span></div>
        </div>
        <button class="btn" id="concluir" type="button">Concluir exercício</button>
        <span class="selo" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M10 26l9 9 19-21"/></svg>
        </span>
      </article>
    </section>

    <aside class="lista">
      <h2>Sequência do treino</h2>
      <ol id="lista"></ol>
    </aside>
  </div>

  <section class="fim" id="fim" hidden>
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21"/><path d="M13 25l8 8 14-17"/></svg>
    <h1 id="fim-titulo" tabindex="-1">Treino concluído</h1>
    <p id="fim-resumo"></p>
    <a class="btn" href="objetivo.html">Montar novo treino</a>
  </section>

</main>

<script src="js/comum.js"></script>
<script src="js/objetivos.js"></script>
<script src="js/shell.js"></script>
<script src="js/treino.js"></script>
</body>
</html>
